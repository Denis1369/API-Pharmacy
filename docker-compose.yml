volumes:
    my-datavolumes:
services:
    db:
        image: mysql
        volumes: 
            - my-datavolumes:/var/lib/mysql
        ports: 
            - 3307:3306
        environment: 
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: pharmacy_db
        networks: 
            - my-network
                
    api:
        build:
            context: ./API-Pharmacy
            dockerfile: Dockerfile
        depends_on: 
            - db
        ports: 
            - "3000:8080"
        environment:
           - DBHOST=db
           - ASPNETCORE_ENVIRONMENT=Development
        networks: 
            - my-network

networks: 
    my-network: